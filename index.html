<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NV So Lit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: #0b2042;
      color: #fff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 1;
    }

    /* Vinyl */
    .vinyl-bg {
      position: absolute;
      right: -12vw;
      top: 50%;
      transform: translateY(-50%);
      width: min(100vh, 96vw);
      height: min(100vh, 96vw);
      will-change: transform;
      pointer-events: none;
      z-index: 2;
    }

    .vinyl-bg svg { width: 100%; height: 100%; }

    /* Cockroach — fixed on page, positioned by JS */
    #roach {
      position: fixed;
      width: 52px;
      height: 52px;
      z-index: 30;
      pointer-events: none;
      transform-origin: center center;
      will-change: transform, left, top;
    }

    #roach svg { width: 100%; height: 100%; display: block; }

    /* ── Hero content ── */
    .hero-content {
      position: relative;
      z-index: 10;
      padding: 0 5vw;
      max-width: 55vw;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ffab40;
    }

    .artist-initial {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 14vw, 12rem);
      line-height: 0.88;
      color: #64d8ff;
      text-shadow: 0 0 80px rgba(100,216,255,0.6), 0 0 160px rgba(100,216,255,0.25);
    }

    .artist-subtitle {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 9vw, 7.5rem);
      line-height: 0.9;
      color: #ffab40;
      text-shadow: 0 0 60px rgba(255,171,64,0.6);
    }

    .hero-stats {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-top: 0.25rem;
    }

    .hstat { display: flex; flex-direction: column; gap: 2px; }

    .hstat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem;
      line-height: 1;
      color: #ffab40;
      text-shadow: 0 0 30px rgba(255,171,64,0.5);
    }

    .hstat-label {
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .hstat-divider {
      width: 1px;
      height: 36px;
      background: rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    .tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-style: italic;
      font-weight: 300;
      color: rgba(255,255,255,0.7);
    }

    .hero-links {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 1.25rem;
      max-width: 270px;
    }

    .hero-link-btn {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 1.1rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      backdrop-filter: blur(12px);
      transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .hero-link-btn:hover {
      background: rgba(255,171,64,0.18);
      border-color: rgba(255,171,64,0.5);
      transform: translateX(5px);
      box-shadow: 0 0 20px rgba(255,171,64,0.2);
    }

    .hero-link-btn svg { flex-shrink: 0; opacity: 0.85; }

    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 5vw;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      animation: hint-bounce 2.5s ease-in-out infinite;
    }

    @keyframes hint-bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(5px); }
    }

    /* ── Below ── */
    .below {
      background: linear-gradient(180deg, #0b2042 0%, #050e22 100%);
      position: relative;
      z-index: 5;
    }

    .content-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .sec-label {
      font-size: 0.62rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffab40;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .sec-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,171,64,0.4), transparent);
    }

    .track-block {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .track-block:hover { border-color: rgba(255,171,64,0.35); }
    .track-block iframe { width: 100%; display: block; border: none; }

    .fade-in { opacity:0; transform:translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .fade-in.visible { opacity:1; transform:translateY(0); }

    footer {
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      background: #050e22;
      position: relative;
      z-index: 5;
    }

    @media (max-width: 600px) {
      .vinyl-bg { right: -32vw; width: 140vw; height: 140vw; }
      .hero-content { max-width: 72vw; }
    }
  </style>
</head>

          <iframe height="120" scrolling="no" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/nvsolitttt/no-pole-ultimate-2&color=%23f57c00&inverse=true&auto_play=false&show_user=true">
          </iframe>
        </div>
        <div class="track-block">
          <iframe height="120" scrolling="no" allow="autoplay"
            src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/nvsolitttt/no-pole-ultimate&color=%23f57c00&inverse=true&auto_play=false&show_user=true">
          </iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>© 2024 NV So Lit · All rights reserved</footer>
</div>

<script>
// ══════════════════════════════════════════
// ANIMATED BACKGROUND
// ══════════════════════════════════════════
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let W, H;

function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const orbs = Array.from({ length: 8 }, (_, i) => ({
  x: Math.random() * innerWidth,
  y: Math.random() * innerHeight,
  r: 150 + Math.random() * 220,
  vx: (Math.random() - 0.5) * 0.45,
  vy: (Math.random() - 0.5) * 0.35,
  hue: i < 5 ? 205 + Math.random() * 35 : 30 + Math.random() * 18,
  phase: Math.random() * Math.PI * 2,
}));

const waves = [
  { amp: 70,  freq: 0.007, speed: 0.0009, phase: 0,   y: 0.52, alpha: 0.09, color: [30, 90, 200] },
  { amp: 45,  freq: 0.011, speed: 0.0013, phase: 1.5, y: 0.63, alpha: 0.08, color: [220, 110, 10] },
  { amp: 55,  freq: 0.006, speed: 0.0007, phase: 3,   y: 0.73, alpha: 0.06, color: [15, 60, 170] },
];

let bgT = 0;
function drawBg() {
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, W * 0.6, H);
  bg.addColorStop(0,   '#132d58');
  bg.addColorStop(0.5, '#1a3f70');
  bg.addColorStop(1,   '#0a1d3e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  orbs.forEach(o => {
    o.x += o.vx + Math.sin(bgT * 0.25 + o.phase) * 0.35;
    o.y += o.vy + Math.cos(bgT * 0.18 + o.phase) * 0.25;
    if (o.x < -o.r) o.x = W + o.r;
    if (o.x > W+o.r) o.x = -o.r;
    if (o.y < -o.r) o.y = H + o.r;
    if (o.y > H+o.r) o.y = -o.r;

    const p = 0.82 + 0.18 * Math.sin(bgT * 0.45 + o.phase);
    const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * p);
    g.addColorStop(0,   `hsla(${o.hue},75%,52%,0.22)`);
    g.addColorStop(0.5, `hsla(${o.hue},65%,40%,0.10)`);
    g.addColorStop(1,   `hsla(${o.hue},60%,30%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r * p, 0, Math.PI * 2);
    ctx.fill();
  });

  waves.forEach(w => {
    w.phase += w.speed;
    ctx.beginPath();
    ctx.moveTo(0, H * w.y);
    for (let x = 0; x <= W; x += 3) {
      const y = H * w.y
        + Math.sin(x * w.freq + w.phase * Math.PI * 2) * w.amp
        + Math.sin(x * w.freq * 1.8 + w.phase * 1.4) * w.amp * 0.35;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    const [r, g, b] = w.color;
    ctx.fillStyle = `rgba(${r},${g},${b},${w.alpha})`;
    ctx.fill();
  });

  // Scanlines
  for (let y = 0; y < H; y += 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.022)';
    ctx.fillRect(0, y, W, 1);
  }

  bgT += 0.016;
  requestAnimationFrame(drawBg);
}
drawBg();

// ══════════════════════════════════════════
// VINYL SPIN
// ══════════════════════════════════════════
const vinylEl = document.getElementById('vinylBg');
let vinylRot  = 0;
let velocity  = 0;
let lastY     = window.scrollY;
let rafId     = null;

function setVinylRot(deg) {
  vinylRot = deg;
  vinylEl.style.transform = `translateY(-50%) rotate(${deg}deg)`;
}

window.addEventListener('scroll', () => {
  const y   = window.scrollY;
  const dv  = (y - lastY) * 1.1;
  lastY = y;
  velocity += dv;

  // trigger roach fling if spinning fast
  if (Math.abs(dv) > 3 && roachState === 'GROOVE') {
    flingRoach(dv);
  }

  if (!rafId) rafId = requestAnimationFrame(spinLoop);
}, { passive: true });

function spinLoop() {
  if (Math.abs(velocity) > 0.03) {
    setVinylRot(vinylRot + velocity);
    velocity *= 0.91;
    rafId = requestAnimationFrame(spinLoop);
  } else {
    velocity = 0;
    rafId = null;
    // Vinyl stopped → roach crawls back
    if (roachState === 'FLUNG') startCrawl();
  }
}

// ══════════════════════════════════════════
// COCKROACH STATE MACHINE
// ══════════════════════════════════════════
// States: GROOVE | FLUNG | CRAWLING

const roachEl   = document.getElementById('roach');
let roachState  = 'GROOVE';
let roachAngle  = 45;      // degrees around disc
let roachRadius = 0.74;    // fraction of disc radius (0=center, 1=edge)
let roachFX     = 0;       // flung position (px, relative to disc center)
let roachFY     = 0;
let roachFVX    = 0;       // flung velocity
let roachFVY    = 0;
let crawlStart  = 0;       // timestamp
let crawlDur    = 2200;    // ms to crawl from center to groove
let legPhase    = 0;

// Get disc center and radius in screen px
function getDisc() {
  const rect = vinylEl.getBoundingClientRect();
  return {
    cx: rect.left + rect.width  / 2,
    cy: rect.top  + rect.height / 2,
    r:  rect.width / 2 * 0.968,   // 242/250 of SVG
  };
}

function placeRoachGroove(disc) {
  // Angle increases with vinyl rotation
  const totalAngle = (roachAngle + vinylRot) * Math.PI / 180;
  const r = disc.r * roachRadius;
  const x = disc.cx + Math.cos(totalAngle) * r - 26;
  const y = disc.cy + Math.sin(totalAngle) * r - 26;
  // Face outward (toward circumference)
  const face = (roachAngle + vinylRot + 90);
  roachEl.style.left = x + 'px';
  roachEl.style.top  = y + 'px';
  roachEl.style.transform = `rotate(${face}deg)`;
}

function flingRoach(dv) {
  roachState = 'FLUNG';
  const disc = getDisc();
  const angle = (roachAngle + vinylRot) * Math.PI / 180;
  const r = disc.r * roachRadius;
  // Current position relative to center
  roachFX = Math.cos(angle) * r;
  roachFY = Math.sin(angle) * r;
  // Tangential fling velocity
  const speed = Math.min(Math.abs(dv) * 2.5, 22);
  const tangAngle = angle + (dv > 0 ? Math.PI / 2 : -Math.PI / 2);
  roachFVX = Math.cos(tangAngle) * speed + (Math.random() - 0.5) * 4;
  roachFVY = Math.sin(tangAngle) * speed + (Math.random() - 0.5) * 4;
  animateFlung();
}

function animateFlung() {
  if (roachState !== 'FLUNG') return;
  const disc = getDisc();
  roachFVX *= 0.96;
  roachFVY *= 0.96;
  roachFX  += roachFVX;
  roachFY  += roachFVY;

  const screenX = disc.cx + roachFX - 26;
  const screenY = disc.cy + roachFY - 26;
  const face    = Math.atan2(roachFVY, roachFVX) * 180 / Math.PI + 90;
  roachEl.style.left      = screenX + 'px';
  roachEl.style.top       = screenY + 'px';
  roachEl.style.transform = `rotate(${face}deg)`;

  // Animate legs frantically
  animateLegs(true);

  if (Math.abs(roachFVX) > 0.3 || Math.abs(roachFVY) > 0.3) {
    requestAnimationFrame(animateFlung);
  }
  // After flung, wait for vinyl stop signal (from spinLoop → startCrawl)
}

function startCrawl() {
  if (roachState !== 'FLUNG') return;
  roachState  = 'CRAWLING';
  crawlStart  = performance.now();
  // randomize new groove angle so roach appears at a different spot
  roachAngle = Math.random() * 360;
  animateCrawl();
}

function animateCrawl() {
  if (roachState !== 'CRAWLING') return;
  const disc    = getDisc();
  const elapsed = performance.now() - crawlStart;
  const t       = Math.min(elapsed / crawlDur, 1);
  // ease in-out cubic
  const eased   = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  const curR    = disc.r * roachRadius * eased;        // 0 → groove radius
  const angle   = (roachAngle + vinylRot) * Math.PI / 180;
  const x = disc.cx + Math.cos(angle) * curR - 26;
  const y = disc.cy + Math.sin(angle) * curR - 26;
  const face = (roachAngle + vinylRot + 90);

  roachEl.style.left      = x + 'px';
  roachEl.style.top       = y + 'px';
  roachEl.style.transform = `rotate(${face}deg)`;

  animateLegs(t < 0.98);

  if (t < 1) {
    requestAnimationFrame(animateCrawl);
  } else {
    roachState = 'GROOVE';
    grooveLoop();
  }
}

// Slow orbit in GROOVE state
function grooveLoop() {
  if (roachState !== 'GROOVE') return;
  roachAngle = (roachAngle + 0.15) % 360;
  const disc = getDisc();
  placeRoachGroove(disc);
  animateLegs(true);
  requestAnimationFrame(grooveLoop);
}

// Leg wiggle
let legTick = 0;
function animateLegs(moving) {
  legTick++;
  const rate = moving ? 4 : 12;
  if (legTick % rate !== 0) return;
  const odd = Math.floor(legTick / rate) % 2 === 0;
  const shift = odd ? 4 : -4;
  // Left legs
  ['ll1','ll2','ll3'].forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    const s = i % 2 === 0 ? shift : -shift;
    const x1 = parseFloat(el.getAttribute('x1'));
    const y1 = parseFloat(el.getAttribute('y1'));
    el.setAttribute('x2', (parseFloat(el.getAttribute('x2')) % 100 ? [5,4,5][i] + (odd ? s : -s) : [5,4,5][i]).toString());
  });
}

// Start in groove
(function init() {
  const disc = getDisc();
  placeRoachGroove(disc);
  grooveLoop();
})();

// ── Fade-in ──
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.12 });
document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));
</script>
</body>
