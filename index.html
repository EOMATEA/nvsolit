<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NV So Lit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:    #1565c0;
      --blue-lt: #1e88e5;
      --blue-dk: #071830;
      --orange:  #f57c00;
      --orange-lt: #ff9800;
      --cyan:    #40c4ff;
      --white:   #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--blue-dk);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ══════════════════════════════════
       ANIMATED BACKGROUND CANVAS
    ══════════════════════════════════ */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ══════════════════════════════════
       HERO
    ══════════════════════════════════ */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      z-index: 1;
    }

    /* ── FULL-SCREEN VINYL WRAPPER ── */
    .vinyl-bg {
      position: absolute;
      right: -15vw;
      top: 50%;
      transform: translateY(-50%);
      width: min(100vh, 100vw);
      height: min(100vh, 100vw);
      will-change: transform;
      pointer-events: none;
      z-index: 2;
      transform-origin: center center;
    }

    .vinyl-bg svg { width: 100%; height: 100%; }

    /* Cockroach on vinyl */
    .cockroach-wrap {
      position: absolute;
      /* orbit at radius ~35% of disc = 175px on a 500px SVG */
      /* We'll place it via JS/CSS animation orbiting the center */
      top: 50%;
      right: -15vw;
      width: min(100vh, 100vw);
      height: min(100vh, 100vw);
      transform: translateY(-50%);
      z-index: 3;
      pointer-events: none;
    }

    .cockroach {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 54px;
      height: 54px;
      margin-top: -27px;
      margin-left: -27px;
      transform-origin: center center;
      animation: cockroach-orbit 8s linear infinite;
      will-change: transform;
    }

    /* Cockroach itself wiggles its legs */
    .cockroach svg {
      animation: roach-legs 0.18s ease-in-out infinite alternate;
    }

    @keyframes cockroach-orbit {
      from { transform: rotate(0deg) translateX(30%) rotate(90deg); }
      to   { transform: rotate(360deg) translateX(30%) rotate(90deg); }
    }

    @keyframes roach-legs {
      from { transform: scaleX(1)   scaleY(1); }
      to   { transform: scaleX(1.06) scaleY(0.94); }
    }

    /* Scared jump when hovered */
    .cockroach-wrap:hover .cockroach {
      animation: cockroach-orbit 1.5s linear infinite, roach-panic 0.3s ease-in-out infinite;
    }

    @keyframes roach-panic {
      0%   { transform: rotate(var(--orbit-angle, 0deg)) translateX(30%) rotate(90deg) scale(1.2); }
      50%  { transform: rotate(var(--orbit-angle, 0deg)) translateX(28%) rotate(90deg) scale(0.9); }
      100% { transform: rotate(var(--orbit-angle, 0deg)) translateX(30%) rotate(90deg) scale(1.2); }
    }

    /* ── Hero content ── */
    .hero-content {
      position: relative;
      z-index: 10;
      padding: 0 5vw;
      max-width: 55vw;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--orange-lt);
      opacity: 0.9;
    }

    .artist-initial {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(5rem, 14vw, 12rem);
      line-height: 0.88;
      color: var(--cyan);
      text-shadow:
        0 0 80px rgba(64,196,255,0.5),
        0 0 160px rgba(64,196,255,0.2),
        2px 2px 0 rgba(0,0,0,0.4);
    }

    .artist-subtitle {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 9vw, 7.5rem);
      line-height: 0.9;
      color: var(--orange-lt);
      text-shadow:
        0 0 60px rgba(255,152,0,0.5),
        2px 2px 0 rgba(0,0,0,0.4);
    }

    .tagline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-style: italic;
      font-weight: 300;
      color: rgba(255,255,255,0.65);
      letter-spacing: 1px;
    }

    /* ── Hero link buttons ── */
    .hero-links {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 1.25rem;
      max-width: 270px;
    }

    .hero-link-btn {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.7rem 1.1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      text-decoration: none;
      color: var(--white);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      backdrop-filter: blur(12px);
      transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .hero-link-btn:hover {
      background: rgba(245,124,0,0.2);
      border-color: rgba(255,152,0,0.5);
      transform: translateX(5px);
      box-shadow: 0 0 20px rgba(255,152,0,0.15);
    }

    .hero-link-btn svg { flex-shrink: 0; opacity: 0.85; }

    /* ── Scroll hint ── */
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 5vw;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      animation: hint-bounce 2.5s ease-in-out infinite;
    }

    @keyframes hint-bounce {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(5px); }
    }

    /* ══════════════════════════════════
       BELOW HERO
    ══════════════════════════════════ */
    .below {
      background: linear-gradient(180deg, var(--blue-dk) 0%, #040e1f 100%);
      position: relative;
      z-index: 5;
    }

    .content-wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .sec-label {
      font-size: 0.62rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--orange-lt);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .sec-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,152,0,0.4), transparent);
    }

    .track-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .track-block:hover { border-color: rgba(255,152,0,0.3); }

    .track-block iframe { width: 100%; display: block; border: none; }

    /* Fade in */
    .fade-in { opacity:0; transform:translateY(16px); transition: opacity 0.6s ease, transform 0.6s ease; }
    .fade-in.visible { opacity:1; transform:translateY(0); }

    footer {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 1.5rem 2rem;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      position: relative;
      z-index: 5;
      background: #040e1f;
    }

    @media (max-width: 600px) {
      .vinyl-bg, .cockroach-wrap { right: -35vw; width: 140vw; height: 140vw; }
      .hero-content { max-width: 72vw; }
    }
  </style>
</head>
<body>

<!-- Animated background canvas -->
<canvas id="bg-canvas"></canvas>

<div style="position:relative; z-index:1;">

<!-- ══════════ HERO ══════════ -->
<section class="hero">

  <!-- Full-screen vinyl SVG -->
  <div class="vinyl-bg" id="vinylBg">
    <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%"   stop-color="#0d1520"/>
          <stop offset="100%" stop-color="#050a10"/>
        </radialGradient>
        <radialGradient id="labelGrad" cx="38%" cy="35%" r="60%">
          <stop offset="0%"   stop-color="#e65100"/>
          <stop offset="50%"  stop-color="#bf360c"/>
          <stop offset="100%" stop-color="#7f1900"/>
        </radialGradient>
        <radialGradient id="sheen" cx="35%" cy="32%" r="55%">

          <stop offset="100%" stop-color="rgba(64,196,255,0)"/>

        <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">

          <stop offset="50%"  stop-color="rgba(64,196,255,0.03)"/>
          <stop offset="100%" stop-color="rgba(64,196,255,0)"/>
        </linearGradient>
        <clipPath id="discClip"><circle cx="250" cy="250" r="248"/></clipPath>
      </defs>

      <!-- Disc base -->
      <circle cx="250" cy="250" r="248" fill="url(#discGrad)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

        <circle cx="250" cy="250" r="216" stroke="rgba(255,255,255,0.028)" stroke-width="1.2"/>

          <line x1="34" y1="30" x2="46" y2="33" stroke="#2c1a06" stroke-width="1.3" stroke-linecap="round"/>

        <line x1="30" y1="47" x2="35" y2="53" stroke="#2c1a06" stroke-width="1" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

    to   { transform: rotate(12deg); }

  @keyframes leg-wave-r {
    from { transform: rotate(12deg); }

<script>
  // ══════════════════════════════════
  // ANIMATED BACKGROUND — Aurora waves + floating orbs
  // ══════════════════════════════════
  const canvas = document.getElementById('bg-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Orbs
  const orbs = Array.from({ length: 7 }, (_, i) => ({
    x:  Math.random() * window.innerWidth,
    y:  Math.random() * window.innerHeight,
    r:  120 + Math.random() * 200,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.3,
    hue: i < 4 ? (200 + Math.random() * 40) : (28 + Math.random() * 20), // blue or orange
    phase: Math.random() * Math.PI * 2,
  }));

  // Wave params
  const waves = [
    { amp: 60, freq: 0.008, speed: 0.0008, phase: 0, y: 0.55, alpha: 0.06, color: '#1565c0' },
    { amp: 40, freq: 0.012, speed: 0.0012, phase: 1, y: 0.65, alpha: 0.05, color: '#f57c00' },
    { amp: 50, freq: 0.007, speed: 0.0006, phase: 2, y: 0.75, alpha: 0.04, color: '#0d47a1' },
  ];

  let t = 0;

  function drawFrame() {
    ctx.clearRect(0, 0, W, H);

    // Base gradient
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0,   '#071830');
    bg.addColorStop(0.5, '#0d2a55');
    bg.addColorStop(1,   '#040e1f');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Orbs
    orbs.forEach(o => {
      o.x += o.vx + Math.sin(t * 0.3 + o.phase) * 0.3;
      o.y += o.vy + Math.cos(t * 0.2 + o.phase) * 0.2;
      if (o.x < -o.r) o.x = W + o.r;
      if (o.x > W + o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = H + o.r;
      if (o.y > H + o.r) o.y = -o.r;

      const pulse = 0.85 + 0.15 * Math.sin(t * 0.5 + o.phase);
      const grad = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * pulse);
      grad.addColorStop(0,   `hsla(${o.hue},80%,45%,0.18)`);
      grad.addColorStop(0.5, `hsla(${o.hue},70%,35%,0.08)`);
      grad.addColorStop(1,   `hsla(${o.hue},60%,25%,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * pulse, 0, Math.PI * 2);
      ctx.fill();
    });

    // Sine waves
    waves.forEach(w => {
      w.phase += w.speed;
      ctx.beginPath();
      ctx.moveTo(0, H * w.y);
      for (let x = 0; x <= W; x += 4) {
        const y = H * w.y + Math.sin(x * w.freq + w.phase * Math.PI * 2) * w.amp
                           + Math.sin(x * w.freq * 1.7 + w.phase * 1.3) * (w.amp * 0.4);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      ctx.fillStyle = w.color + Math.round(w.alpha * 255).toString(16).padStart(2,'0');
      ctx.fill();
    });

    // Subtle scan-line texture
    for (let y = 0; y < H; y += 4) {
      ctx.fillStyle = 'rgba(0,0,0,0.025)';
      ctx.fillRect(0, y, W, 1);
    }

    t += 0.016;
    requestAnimationFrame(drawFrame);
  }

  drawFrame();

  // ══════════════════════════════════
  // VINYL SPIN on scroll (inertia)
  // ══════════════════════════════════
  const vinylBg = document.getElementById('vinylBg');
  const cwrap   = document.getElementById('cockroachWrap');
  let rotation  = 0;
  let velocity  = 0;
  let lastY     = window.scrollY;
  let rafId     = null;
  let autoSpin  = false;

  function applyRot() {
    const t = `translateY(-50%) rotate(${rotation}deg)`;
    vinylBg.style.transform = t;
    cwrap.style.transform   = t;
  }

  window.addEventListener('scroll', () => {
    if (autoSpin) return;
    const y = window.scrollY;
    velocity += (y - lastY) * 1.1;
    lastY = y;
    if (!rafId) rafId = requestAnimationFrame(inertia);
  }, { passive: true });

  function inertia() {
    if (Math.abs(velocity) > 0.03) {
      rotation += velocity;
      velocity *= 0.91;
      applyRot();
      rafId = requestAnimationFrame(inertia);
    } else {
      velocity = 0;
      rafId = null;
    }
  }

  // ── Fade-in observer ──
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.12 });
  document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
